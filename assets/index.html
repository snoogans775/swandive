<html>

<head>
  <meta charset="utf-8" />
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("swandive.wasm"), go.importObject).then(wasm => {
      go.run(wasm.instance);
    });
  </script>
  <style>
    :root {
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      flex-direction: column;
      width: 100%;
      height: 100%;
      margin: 10px;
      background: black;
      color: #DDD;
      text-align: center;
    }

    h1 {
      max-width: 30ch;
    }
    label {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .btn-hotspot, .btn-piano-key, #btn-bank-select, #btn-album-dec, #btn-album-inc {
	  opacity: 0;
	  pointer-events: all;
	  cursor: pointer;
    }
    .btn-animated:active {
    	background: black;
	opacity: 0.2;
    }

    .lcd-container {
	  width: 100%;
	  height: 100%;
	  overflow: hidden; /* This creates the "window" */
	  white-space: nowrap;
	  color: #333;      /* LCD Text Color */
	  font-family: monospace;
	  font-size: 3em;
	  display: flex;
	  align-items: center;
	}

	.lcd-text {
	  display: inline-block;
	  animation: marquee 10s steps(40) infinite;
	}

	@keyframes marquee {
	  to { transform: translateX(-40ch); }
	}

    .casio-img {
        display: block;
        max-height: 400px;
        width: auto;
    }
 
  </style>
</head>

<body>
  <h1>Squatsoft Casio Interface</h1>
  <section id="ui">
  <div style="position: relative; display: inline-block;">
    
    <img class="casio-img" src="/casio.jpg" id="synth-image">

    <svg 
      viewBox="0 0 1000 400" 
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
      xmlns="http://www.w3.org/2000/svg">
      
      <rect data-track-button-index="0" x="35" y="80" width="50" height="35" class="btn-hotspot btn-animated" />
      <rect data-track-button-index="1" x="90" y="80" width="50" height="35" class="btn-hotspot btn-animated" />
      <rect data-track-button-index="2" x="145" y="80" width="50" height="35" class="btn-hotspot btn-animated" />
      <rect data-track-button-index="3" x="200" y="80" width="50" height="35" class="btn-hotspot btn-animated" />
      <rect data-track-button-index="4" x="255" y="80" width="50" height="35" class="btn-hotspot btn-animated" />
      <rect data-track-button-index="5" x="310" y="80" width="50" height="35" class="btn-hotspot btn-animated" />
      <rect data-track-button-index="6" x="365" y="80" width="50" height="35" class="btn-hotspot btn-animated" />
      <rect data-track-button-index="7" x="425" y="80" width="50" height="35" class="btn-hotspot btn-animated" />

      <rect id="btn-bank-select" x="515" y="80" width="50" height="35" class="btn-animated" />
      
      <rect id="btn-album-dec" x="660" y="170" width="50" height="35" class="btn-animated" />
      <rect id="btn-album-inc" x="725" y="170" width="50" height="35" class="btn-animated" />

      <foreignObject x="710" y="-60" width="195" height="140">
        <div xmlns="http://www.w3.org/1999/xhtml" class="lcd-container">
          <div id="lcd-display" class="lcd-text">SYSTEM READY - INITIALIZING...</div>
        </div>
      </foreignObject>

      <!-- keys -->
      <rect data-piano-key-button-index="0" x="15" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="1" x="86" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="2" x="157" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="3" x="228" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="4" x="299" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="5" x="370" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="6" x="441" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="7" x="512" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="8" x="583" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="9" x="654" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="10" x="725" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="11" x="796" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="12" x="867" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      <rect data-piano-key-button-index="13" x="938" y="380" width="70" height="175" class="btn-piano-key btn-animated" />
      
    </svg>
  </div>
</section>
</body>

</html>
