<html>

<head>
  <meta charset="utf-8" />
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("swandive.wasm"), go.importObject).then(wasm => {
      go.run(wasm.instance);
    });
  </script>
  <style>
    :root {
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      flex-direction: column;
      width: 100%;
      height: 100%;
      margin: 10px;
      background: black;
      color: #DDD;
      text-align: center;
    }

    h1 {
      max-width: 30ch;
    }
    label {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .btn-hotspot {
	  fill: rgba(255, 0, 0, 0.3); 
	  stroke: red;
	  stroke-width: 2;
	  cursor: pointer;
	  transition: fill 0.2s;
	}

	.btn-hotspot:hover {
	  fill: rgba(255, 0, 0, 0.6);
	}

	.casio-img {
	  display: block;
	  max-height: 400px;
	  width: auto;
	}
 
  </style>
</head>

<body>
  <h1>Squatsoft Casio Interface</h1>
  <section id="ui">
  <div style="position: relative; display: inline-block;">
    
    <img class="casio-img" src="/casio.jpg" id="synth-image">

    <svg 
      viewBox="0 0 1000 400" 
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
      xmlns="http://www.w3.org/2000/svg">
      
      <rect data-track-button-index="1" x="35" y="80" width="50" height="35" class="btn-hotspot" />
      <rect data-track-button-index="2" x="90" y="80" width="50" height="35" class="btn-hotspot" />
      <rect data-track-button-index="3" x="145" y="80" width="50" height="35" class="btn-hotspot" />
      <rect data-track-button-index="4" x="200" y="80" width="50" height="35" class="btn-hotspot" />
      <rect data-track-button-index="5" x="255" y="80" width="50" height="35" class="btn-hotspot" />
      <rect data-track-button-index="6" x="310" y="80" width="50" height="35" class="btn-hotspot" />
      <rect data-track-button-index="7" x="365" y="80" width="50" height="35" class="btn-hotspot" />
      <rect data-track-button-index="8" x="425" y="80" width="50" height="35" class="btn-hotspot" />
      
      <circle id="knob-vol" cx="800" cy="150" r="30" class="btn-hotspot" />
      
    </svg>
  </div>
</section>
</body>

</html>
